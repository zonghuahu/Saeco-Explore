<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For Saeco - Exploring the World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Leaflet Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              dreamy: {
                pink: '#fce7f3',   // Pink 100
                blue: '#e0f2fe',   // Sky 100
                purple: '#f3e8ff', // Purple 100
                accent: '#f472b6', // Pink 400
                deep: '#4f46e5',   // Indigo 600
                text: '#334155',   // Slate 700
              },
              glass: {
                white: 'rgba(255, 255, 255, 0.65)',
                clear: 'rgba(255, 255, 255, 0.3)',
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'float-delayed': 'float 6s ease-in-out 3s infinite',
              'scale-in': 'scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
              'pulse-slow': 'pulse 5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'spin-slow': 'spin 12s linear infinite',
              'slide-in-right': 'slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                '50%': { transform: 'translateY(-15px) rotate(1deg)' },
              },
              scaleIn: {
                '0%': { transform: 'scale(0.9) translateY(10px)', opacity: '0' },
                '100%': { transform: 'scale(1) translateY(0)', opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideInRight: {
                '0%': { opacity: '0', transform: 'translateX(20px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background: linear-gradient(135deg, #fff1f2 0%, #e0f2fe 50%, #f3e8ff 100%);
        color: #334155;
        margin: 0;
        overflow: hidden;
      }
      /* Custom Scrollbar - Light Theme */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.05); 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(244, 114, 182, 0.4); 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(244, 114, 182, 0.7); 
      }
      
      .glass-panel-light {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
      }
      
      .polaroid {
        background: white;
        padding: 12px 12px 40px 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        transform: rotate(-3deg);
        transition: transform 0.3s ease;
      }
      .polaroid:hover {
        transform: rotate(0deg) scale(1.02);
        z-index: 10;
      }

      /* 
       * CUSTOM LEAFLET STYLES 
       */
      
      /* Reset Leaflet font */
      .leaflet-container {
        font-family: 'Outfit', sans-serif !important;
        background: #e0f2fe !important; /* Ocean color match */
      }

      /* Fix Leaflet DivIcon default background */
      .custom-pin-container {
        background: transparent !important;
        border: none !important;
      }

      /* 
       * GEMSTONE MARKER STYLES (MATTE FLAT DESIGN)
       */
      .gemstone-wrapper {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.15));
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        cursor: pointer;
      }
      
      .gemstone-wrapper:hover {
        transform: scale(1.15) translateY(-5px);
        z-index: 1000 !important;
      }

      .gemstone-shape {
        width: 32px;
        height: 32px;
        /* Matte Gradient: Soft Pink -> Rose (No Shine) */
        background: linear-gradient(135deg, #fbcfe8 0%, #f472b6 100%);
        /* Matte Gold Border */
        border: 3px solid #eebb99; 
        /* Teardrop shape pointing down */
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        position: relative;
        box-shadow: none;
      }

      /* Clean White Center Dot (Flat) */
      .gemstone-shape::after {
        content: '';
        position: absolute;
        width: 10px;
        height: 10px;
        background: white;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        filter: none;
      }

      .gemstone-shape::before {
        display: none;
      }

      .leaflet-control-attribution {
        background: rgba(255,255,255,0.5) !important;
        backdrop-filter: blur(4px);
        border-radius: 4px;
        font-size: 9px !important;
        color: #64748b !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.4"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <!-- Entry Point for Vite -->
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
